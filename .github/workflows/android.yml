name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build offline Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android SDK and install platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Bundle offline application
        run: |
          mkdir -p android/app/src/main/assets
          python3 - <<'PY'
          from pathlib import Path
          import base64
          html = Path("web/index.html").read_text(encoding="utf-8")
          icon = Path("android/app/src/main/res/drawable-nodpi/ic_launcher_art.webp").read_bytes()
          data_uri = "data:image/webp;base64," + base64.b64encode(icon).decode("ascii")
          old_logo = '<span class="mark">✧</span>'
          new_logo = '<span class="mark"><img alt="" src="' + data_uri + '" style="height:100%;width:100%;object-fit:cover;border-radius:50%;display:block"></span>'
          if old_logo not in html:
              raise SystemExit("Missing logo placeholder in HTML")
          html = html.replace(old_logo, new_logo, 1)
          genetics_tag = '<script src="genetics_v07.js"></script>'
          if genetics_tag not in html:
              raise SystemExit("Missing genetics script tag")
          genetics = Path("web/genetics_v07.js").read_text(encoding="utf-8")
          html = html.replace(genetics_tag, "<script>\n" + genetics + "\n</script>", 1)
          detail_tag = '<script src="anatomy_detail_v071.js"></script>'
          if detail_tag not in html:
              raise SystemExit('Missing anatomy detail module')
          detail_js = Path('web/anatomy_detail_v071.js').read_text(encoding='utf-8')
          html = html.replace(detail_tag, "<script>\n" + detail_js + "\n</script>", 1)
          shape_tag = '<script src="anatomy_shapes_v072.js"></script>'
          if shape_tag not in html:
              raise SystemExit('Missing anatomy shapes script')
          shapes_js = Path("web/anatomy_shapes_v072.js").read_text(encoding="utf-8")
          html = html.replace(shape_tag, "<script>\n" + shapes_js + "\n</script>", 1)
          # Bundle genuine transparent SVG torso assets inside the HTML:
          # Android WebView does not permit extra file access.
          import json
          torso_tag = '<script src="modular_editor_v073.js"></script>'
          if torso_tag not in html:
              raise SystemExit("Missing modular sprite module")
          sprites = {p.stem.removeprefix("torso_"): p.read_text(encoding="utf-8")
                     for p in sorted(Path("web/sprites").glob("torso_*.svg"))}
          expected = {"humanoid","aquatic","fae","draconic","alien","arboreal"}
          if set(sprites) != expected:
              raise SystemExit("Wrong modular torso asset set")
          module = Path("web/modular_editor_v073.js").read_text(encoding="utf-8")
          manifest = json.loads(Path("web/sprites/manifest_v080.json").read_text(encoding="utf-8"))
          embedded = "<script>window.AtlasTorsoAssets=" + json.dumps(sprites, ensure_ascii=False) + ";window.AtlasTorsoManifest=" + json.dumps(manifest, ensure_ascii=False) + ";</script>"
          html = html.replace(torso_tag, embedded + "<script>\n" + module + "\n</script>", 1)
          foundation_tag = '<script src="modular_foundation_v074.js"></script>'
          if foundation_tag not in html:
              raise SystemExit("Missing modular foundation")
          foundation_js = Path("web/modular_foundation_v074.js").read_text(encoding="utf-8")
          html = html.replace(foundation_tag, "<script>\n" + foundation_js + "\n</script>", 1)
          art_tag = '<script src="mermaid_painter_v075.js"></script>'
          if art_tag not in html:
              raise SystemExit('Missing mermaid art module')
          art_directory = Path('web/sprites/mermaid_v075')
          art_parts = {p.stem: base64.b64encode(p.read_bytes()).decode('ascii')
                       for p in sorted(art_directory.glob('*.webp'))}
          if len(art_parts) != 9:
              raise SystemExit('Missing mermaid painted sprite layers')
          art_manifest = json.loads((art_directory / 'manifest.json').read_text(encoding='utf-8'))
          art_globals = '<script>window.AtlasPaintedMermaidAssets=' + json.dumps(art_parts) + ';window.AtlasMermaidPaintManifest=' + json.dumps(art_manifest,ensure_ascii=False) + ';</script>'
          art_js = Path('web/mermaid_painter_v075.js').read_text(encoding='utf-8')
          html = html.replace(art_tag, art_globals + '<script>\n' + art_js + '\n</script>', 1)
          # Preserve the standalone sprite assets and their manifest in the APK too.
          import shutil
          shutil.copytree("web/sprites", "android/app/src/main/assets/sprites", dirs_exist_ok=True)
          Path("android/app/src/main/assets/index.html").write_text(html,encoding="utf-8")
          PY

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-mirov-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
