name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build offline Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android SDK and install platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Bundle offline application
        run: |
          mkdir -p android/app/src/main/assets
          python3 - <<'PY'
          from pathlib import Path
          import base64
          html = Path("web/index.html").read_text(encoding="utf-8")
          icon = Path("android/app/src/main/res/drawable-nodpi/ic_launcher_art.webp").read_bytes()
          data_uri = "data:image/webp;base64," + base64.b64encode(icon).decode("ascii")
          old_logo = '<span class="mark">✧</span>'
          new_logo = '<span class="mark"><img alt="" src="' + data_uri + '" style="height:100%;width:100%;object-fit:cover;border-radius:50%;display:block"></span>'
          if old_logo not in html:
              raise SystemExit("Missing logo placeholder in HTML")
          html = html.replace(old_logo, new_logo, 1)
          genetics_tag = '<script src="genetics_v07.js"></script>'
          if genetics_tag not in html:
              raise SystemExit("Missing genetics script tag")
          genetics = Path("web/genetics_v07.js").read_text(encoding="utf-8")
          html = html.replace(genetics_tag, "<script>\\n" + genetics + "\\n</script>", 1)
          Path("android/app/src/main/assets/index.html").write_text(html,encoding="utf-8")
          PY

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-mirov-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
